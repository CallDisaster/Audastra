name: cla

# 贡献者协议：PR 作者在 PR 里回复约定语句即完成签署，签署记录保存在本仓库的 cla-signatures 分支。
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/CallDisaster/Audastra/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: CallDisaster,bot*
          custom-notsigned-prcomment: '感谢你的贡献！合并前请阅读 [贡献者协议](https://github.com/CallDisaster/Audastra/blob/main/CLA.md)，同意后在本 PR 下回复下面这句英文完成签署（只需签一次）。Thank you! Please read the CLA and reply with the sentence below to sign it.'
          custom-allsigned-prcomment: '所有贡献者都已签署贡献者协议，谢谢！All contributors have signed the CLA.'
